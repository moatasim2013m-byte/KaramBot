# Run the test suite on every push and pull request.
#
# This exists because of what a five-day-old branch showed: three tests began failing the day
# after they were written — a fake clock pinned to a date, while the code reads the real one —
# and nothing noticed, because nothing ran them. A suite only protects what it is run against.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run it interrupts: only the newest commit's result matters.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Prisma client
        working-directory: backend
        run: npx prisma generate

      # The suite mocks Prisma and axios, so it needs no database and reaches no network. The
      # values below only have to exist and be the right shape: validateEnv rejects a
      # TOKEN_ENCRYPTION_KEY that is not 64 hex characters, and tests/setup.js sets its own.
      - name: Test
        working-directory: backend
        run: npm test -- --ci
        env:
          NODE_ENV: test
          CI: true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # No tests here yet; a build failure is still the thing that would break the dashboard,
      # and it catches an import that does not resolve before it reaches a customer.
      - name: Build
        working-directory: frontend
        run: npm run build
