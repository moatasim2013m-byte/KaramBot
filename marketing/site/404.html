<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>الصفحة غير موجودة — شِفت</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0F1E38;color:#B8C4DA;
  font-family:'Cairo',system-ui,sans-serif;text-align:center;line-height:1.85;
  background-image:radial-gradient(60% 50% at 20% 10%,rgba(31,107,255,.35),transparent),radial-gradient(40% 40% at 90% 90%,rgba(242,179,61,.18),transparent)}
.box{max-width:460px}
.code{font-size:76px;font-weight:800;color:#F2B33D;line-height:1;margin-bottom:14px}
h1{color:#fff;font-size:25px;font-weight:800;margin:0 0 12px}
p{margin:0 0 30px;font-size:16.5px}
a{display:inline-block;background:#1F6BFF;color:#fff;text-decoration:none;font-weight:700;padding:13px 28px;border-radius:999px;font-size:15.5px;box-shadow:0 10px 30px -10px rgba(31,107,255,.6)}
a:hover{background:#175ae0}
</style>
</head>
<body><div class="box"><div class="code">404</div><h1>الصفحة غير موجودة</h1><p>الرابط الذي فتحته غير صحيح أو لم يعد متاحًا.</p><a href="/">العودة إلى صفحة شِفت</a></div></body>
</html>
