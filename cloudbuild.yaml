steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/peekaboo:$SHORT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/peekaboo:$SHORT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/peekaboo:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--service-account=peekaboo-indoor-playground@gen-lang-client-0086895721.iam.gserviceaccount.com'
      - '--update-env-vars=NODE_ENV=production,DB_NAME=${_DB_NAME},GCS_BUCKET_NAME=${_GCS_BUCKET_NAME}'
      - '--update-secrets=MONGO_URL=MONGO_URL:latest,JWT_SECRET=JWT_SECRET:latest'
      - '--quiet'

images:
  - 'gcr.io/$PROJECT_ID/peekaboo:$SHORT_SHA'

substitutions:
  _SERVICE_NAME: 'peekaboo-indoor-playground'
  _REGION: 'us-west1'
  _DB_NAME: 'peekaboo'
  _GCS_BUCKET_NAME: 'peekaboo-uploads'

options:
  logging: CLOUD_LOGGING_ONLY
